<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AdjFlow</title>
    <link rel="stylesheet" href="style.css">
    <!-- Bindet die Adobe CEP Schnittstelle im Frontend ein -->
    <script src="CSInterface.js"></script> 
</head>
<body>
    <div class="container">
        <!-- Linker Button: Adjustment Layer -->
        <button id="btn-adj" class="btn" title="Adjustment Layer einfügen">
            <svg viewBox="0 0 24 24" class="icon">
                <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 18V4a8 8 0 0 1 0 16z"/>
            </svg>
        </button>
        
        <!-- Rechter Button (Platzhalter für spätere Funktion) -->
        <button id="btn-square" class="btn">
            <div class="square-icon"></div>
        </button>
    </div>

    <script src="main.js"></script>
</body>
</html>
